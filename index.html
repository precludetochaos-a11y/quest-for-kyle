  const c=AU.c,t0=c.currentTime+when,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);

}

/* ---------- Stick of Truth ring block ---------- */
let blockQ=null;
function startBlock(target,label,cb,opt={}){
  const impact=opt.slow?1.9:0.75+rnd()*0.55;
  blockQ={t:0,impact,tgt:target,label,cb,done:false,win:opt.slow?1.8:1};
  show(`${label}\n<span class="note">Press Space the moment the yellow ring flashes!</span>`,[{label:'Block!',fn:pressBlock}],{instant:true,hint:'Space, Enter or click right as the ring closes.'});
}
function pressBlock(){if(!blockQ||blockQ.done||paused)return;const d=Math.abs(blockQ.t-blockQ.impact),w=blockQ.win||1;resolveBlock(blockQ.t<blockQ.impact-0.16*w?'miss':d<=0.07*w?'perfect':d<=0.17*w?'good':'miss');}
function resolveBlock(res){const b=blockQ;if(!b||b.done)return;b.done=true;blockQ=null;b.cb(res);}

    if(dmg>0)hurt(x,dmg,'#ff7a6a');else popOn(x,'BLOCKED','#8ff58a',-4);

    if(x.hp<=0)msg+=` ${x.name} ${x.you?'are':'is'} knocked out!${x.buddy?' <span class="note">(Revive with Smelling Salts, or swap in another buddy.)</span>':''}`;}

  const p2=f.phase===2?1.35:1,pm=f.st.pumped?1.4:1,hits=mv.hits||1;let msg=`${f.name}: <b>${mv.n}!</b>`,i=0,perfects=0;

    startBlock(tg0,lab,res=>{if(B.fguard&&tg0.you&&res!=='perfect'){res='perfect';B.fguard=false;popOn(tg0,'FEATHER GUARD','#ffffff',-20);}B.lunge={who:f,t:0};sfx(res==='perfect'?'block':'hurt');shake=res==='miss'?5:2;resultPop(res==='perfect'?'block':res);if(res==='perfect'){perfects++;if(tg0.you&&B.used)B.used.block=1;}

function miniMove(dt,o,max){
  let ix=(keys.r?1:0)-(keys.l?1:0),iy=(keys.d?1:0)-(keys.u?1:0);let arrive=1;
  if(ix||iy)o.target=null;else if(o.target){const dx=o.target.x-o.x,dy=o.target.y-o.y,d=Math.hypot(dx,dy);if(d<3)o.target=null;else{ix=dx/d;iy=dy/d;arrive=clamp(d/20,0.3,1);}}

const KART={img:new Image(),face:new Image(),ver:0,custom:false};
function kartLoad(){let d=null;try{d=localStorage.getItem('qk_kyle_pic');localStorage.removeItem('qk_kyle_walk');localStorage.removeItem('qk_kyle_port');}catch(e){}
  KART.custom=!!d;KART.img.onload=KART.face.onload=()=>{KART.ver++;KCUT.clear();};KART.img.src=d||KYLE_PNG;if(!KART.face.src)KART.face.src=KYLE_FACE_PNG;}
const KCUT=new Map();
kartLoad();
function kyleWalkFrame(dir,fr){const img=KART.img;if(!img.complete||!img.naturalWidth)return null;const bob=fr<4&&(fr===1||fr===3)?1:0,flip=dir==='left',k='w'+bob+flip+'|'+KART.ver;let c=KCUT.get(k);if(c)return c;
  const [cc,cg]=mk(24,36);if(flip){cg.translate(24,0);cg.scale(-1,1);}cg.drawImage(img,0,-bob);KCUT.set(k,cc);return cc;}
function kylePortFrame(mood,blink,talk){const img=KART.img;if(!img.complete||!img.naturalWidth)return null;const bob=talk?1:0,k='p'+bob+'|'+KART.ver+KART.custom;let c=KCUT.get(k);if(c)return c;
  if(!KART.custom&&KART.face.complete&&KART.face.naturalWidth){const [fc,fg]=mk(64,64);fg.drawImage(KART.face,0,-bob);if(bob)fg.drawImage(KART.face,0,63,64,1,0,63,64,1);KCUT.set(k,fc);return fc;}
  const [cc,cg]=mk(64,64);using(cg,()=>{R(0,0,64,64,'#e8b774');for(let y=0;y<64;y+=2)dithRow(0,y,64,'#efc488',y/2);R(0,52,64,12,'#d8a060');});
  cg.imageSmoothingEnabled=false;cg.drawImage(img,1,0,21,21,1,1-bob,63,63);KCUT.set(k,cc);return cc;}
function kartPick(){const inp=document.createElement('input');inp.type='file';inp.accept='image/png,image/*';
  inp.onchange=()=>{const f=inp.files&&inp.files[0];if(!f)return kartMenu();const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{
    if(img.naturalWidth!==24||img.naturalHeight!==36){kartMenu(`<span class="bad">That picture is ${img.naturalWidth}x${img.naturalHeight}. Kyle's picture needs to be exactly 24x36 pixels.</span>`);return;}
    try{localStorage.setItem('qk_kyle_pic',rd.result);}catch(e){}KART.custom=true;KART.img.src=rd.result;KCUT.clear();kartMenu('<span class="good">Kyle has your new picture!</span>');};img.src=rd.result;};rd.readAsDataURL(f);};inp.click();}
function kartMenu(msg=''){show(`<b>Kyle's picture</b>\nKyle is one 24x36 PNG. Draw him in any pixel-art editor with his feet at the bottom middle, then load it here.${msg?'\n'+msg:''}`,[
  {label:"Load Kyle's picture",fn:()=>kartPick()},
  {label:'Reset to the original picture',fn:()=>{try{localStorage.removeItem('qk_kyle_pic');}catch(e){}KCUT.clear();kartLoad();kartMenu('<span class="good">Kyle is back to his original picture.</span>');}},
  {label:'Back',fn:()=>{if(KART.back)KART.back();else resumeGame();}}]);}
/* ================= varied journey: choices, rival Kyle, detours, town modes ================= */
function CH_(){if(!S.ch)S.ch={};return S.ch;}
function GOS(){if(!S.gos)S.gos={};return S.gos;}
/* ---------- 1. choices that carry forward ---------- */
const BOSSCHOICE={
  baron:{q:'The Tar Baron lies in his own vat, wig drooping. What do you do with him?',
    a:[{k:'spare',label:'Spare him <span class="note">his goons may remember the favor</span>',res:'"Most... gracious." The Baron salutes you with a dripping ladle. <span class="good">His Pitch Goons won\'t forget this.</span>'},
       {k:'rob',label:'Take his strongbox <span class="note">+$4, but word gets around</span>',fn:()=>{S.money=r2(S.money+4);bumpAw(1);},res:'You crack the strongbox. <span class="good">+$4.</span> <span class="bad">The story spreads fast. Kyle\'s Awareness rises.</span>'}]},
  duchess:{q:'Ella Jane sits in a heap of her own feathers while her guests stare. What now?',
    a:[{k:'humiliate',label:'Make an example of her <span class="note">+2 petition signatures, but gossip travels</span>',fn:()=>{CH_();S.sigs=S.sigs||{};S.sigs['hum1']=1;S.sigs['hum2']=1;},res:'You read Kyle\'s love letters aloud. The guests howl and two sign your petition on the spot. <span class="bad">Gossip will reach Philadelphia before you do. Expect higher prices.</span>'},
       {k:'gracious',label:'Help her up <span class="note">let her keep her dignity</span>',fn:()=>{S.straps.s_holy=(S.straps.s_holy||0)+1;},res:'She dusts herself off. "Take this. Make him pay." <span class="good">Ella Jane gives you a Holy Strap-On.</span>'}]},
  brickwall:{q:'Brickwall sits in the rubble of Carpenters\' Hall, sulking. "Mr. Kyle never paid me anyway."',
    a:[{k:'recruit',label:'"Help me catch him in Boston." <span class="note">he\'ll be there for the final siege</span>',res:'Brickwall cracks his knuckles. "Boston. I\'ll be there." <span class="good">Brickwall will join the siege.</span>'},
       {k:'loot',label:'Take Kyle\'s travel money <span class="note">+$5</span>',fn:()=>{S.money=r2(S.money+5);},res:'You shake out Kyle\'s luggage. <span class="good">+$5.</span>'}]},
  pomfrey:{q:'Colonel Pomfrey hands over his saber. "My regiment is at your disposal. Mostly."',
    a:[{k:'surrender',label:'Accept the regiment\'s surrender <span class="note">no redcoats on the road or in Boston</span>',res:'"Stand down, men!" <span class="good">The redcoats won\'t bother you again.</span>'},
       {k:'arrest',label:'Have him arrested for helping a thief <span class="note">+3 petition signatures</span>',fn:()=>{S.sigs=S.sigs||{};for(const k of ['arr1','arr2','arr3'])S.sigs[k]=1;},res:'The crowd cheers as Pomfrey is marched off. <span class="good">Three onlookers sign your petition.</span>'}]}};
function bossChoice(key,msg){const c=BOSSCHOICE[key];save();if(TOWNS[S.loc])scene('town');
  show(`${msg}\n\n<b>${c.q}</b>`,c.a.map(a=>({label:a.label,fn:()=>{CH_()[key]=a.k;if(a.fn)a.fn();save();sfx('win');const mk={baron:'tar',duchess:'feathers',brickwall:'rail',pomfrey:'proclamation'}[key];if(mk&&!m4()[mk])winMaterial(mk,()=>townMenu(a.res));else townMenu(a.res);}})));}
/* ---------- 2. Kyle the recurring rival ---------- */
const RIVAL_MILE={1:95,2:100,3:75,4:105};
const RIVAL={
  1:{line:'Hoofbeats! Kyle gallops past on a stolen horse and scoops a sack of your food off the wagon. "Thanks for lunch, old friend!"',lose:()=>{const f=Math.min(S.food,15);S.food-=f;return `<span class="bad">Kyle rides off with ${f} lb of your food.</span>`;},win:()=>'You yank the sack back. Kyle tumbles off the horse, swears, and runs. <span class="good">Food saved, plus $1 that fell out of his pocket.</span>',bonus:1},
  2:{line:'Your camp at dusk. Kyle strolls in like he owns it. "I\'ll just take this," he says, lifting a bucket of your tar.',lose:()=>{if(S.tar>0){S.tar--;return '<span class="bad">Kyle strolls off with a bucket of your tar.</span>';}return 'Kyle finds no tar and leaves, deeply offended.';},win:()=>'Kyle trips over a tent rope and bolts into the dark. <span class="good">Your tar is safe, and he dropped $2.</span>',bonus:2},
  3:{line:'A carriage pulls alongside. Kyle leans out the window and tosses a lit firecracker at your firewood. "Toasty!"',lose:()=>{const f=Math.min(S.firewood,2);S.firewood-=f;return `<span class="bad">${f} bundle${f===1?'':'s'} of firewood go up in smoke.</span>`;},win:()=>'You kick the firecracker back into his carriage. It goes off. Kyle flees, smoking. <span class="good">+$2 in scattered coins.</span>',bonus:2},
  4:{line:'Kyle blocks the road on foot, arms crossed. "Let\'s be reasonable. Five dollars to turn around and go home."',bribe:true,lose:()=>'',win:()=>'Kyle dives into a hedge and is gone. <span class="good">He dropped $3.</span> "BOSTON," he yells from somewhere. "I\'LL BE READY!"',bonus:3}};
function kyleRival(leg){const r=RIVAL[leg];S.flags['rival'+leg]=true;save();sfx('bad');

/* ================= cutscene director: camera shots, bubbles, acting ================= */
const CAM={x:0,y:217,z:1,tilt:0,tx:0,ty:217,tz:1,ttilt:0,glide:false,punch:0};
let CB=null;
function camApply(){const z=CAM.z+CAM.punch,ti=CAM.tilt;if(z===1&&!ti)return;G.translate(W/2,H/2);if(ti)G.rotate(ti);G.scale(z,z);G.translate(-W/2,-H/2);}
function w2s(wx,wy){const bx=wx-camx-W/2,by=wy-camy-H/2,z=CAM.z+CAM.punch,c=Math.cos(CAM.tilt),s=Math.sin(CAM.tilt);return [W/2+(bx*c-by*s)*z,H/2+(bx*s+by*c)*z];}
function actorPos(id){const a=cut&&cut.actors[id];return a?{x:a.x,y:a.y}:null;}
function nearestActor(id){const a=actorPos(id);let best=null,bd=1e9;for(const [k,b] of Object.entries(cut.actors)){if(k===id||b.x<-30||b.x>TOWNS[S.loc].w+30)continue;const d=Math.abs(b.x-a.x)+Math.abs(b.y-a.y);if(d<bd){bd=d;best=k;}}return bd<200?best:null;}
function setShot(kind,on,glide){if(!cut)return;const ids=(Array.isArray(on)?on:[on]).filter(i=>i&&cut.actors[i]);const P0=ids.map(actorPos);
  const avg=P0.length?{x:P0.reduce((s,p)=>s+p.x,0)/P0.length,y:P0.reduce((s,p)=>s+p.y,0)/P0.length}:{x:cut.focus||camx+W/2,y:YMIN+10};
  let t={x:avg.x,y:217,z:1,tilt:0};
  if(kind==='wide'){const all=Object.values(cut.actors).filter(a=>a.x>-30&&a.x<TOWNS[S.loc].w+30);t.x=cut.focus!=null?cut.focus:(all.length?all.reduce((s,a)=>s+a.x,0)/all.length:avg.x);t.y=217;}
  else if(kind==='two'||kind==='medium'){t.z=2;t.y=avg.y-18;}
  else if(kind==='close'){t.z=3;t.y=avg.y-20;}
  else if(kind==='low'){t.z=3;t.y=avg.y-H/2/3+6;t.tilt=0.04;}
  else if(kind==='dutch'){t.z=2;t.y=avg.y-18;t.tilt=(cut.i%2?0.13:-0.13);}
  else if(kind==='ots'&&P0.length>=2){t.z=2;t.x=P0[0].x+(P0[1].x-P0[0].x)*0.38;t.y=(P0[0].y+P0[1].y)/2-18;}
  const m=(W/2)*(1-1/t.z);t.x=clamp(t.x,W/2-m,TOWNS[S.loc].w-W/2+m);
  CAM.tx=t.x;CAM.ty=t.y;CAM.tz=t.z;CAM.ttilt=t.tilt;CAM.glide=!!glide;if(!glide){CAM.x=t.x;CAM.y=t.y;CAM.z=t.z;CAM.tilt=t.tilt;}}
function camUpdate(dt){if(!cut){CAM.z=1;CAM.tilt=0;CAM.punch=0;return;}const k=CAM.glide?1-Math.exp(-dt*4):1;
  CAM.x+=(CAM.tx-CAM.x)*k;CAM.y+=(CAM.ty-CAM.y)*k;CAM.z+=(CAM.tz-CAM.z)*k;CAM.tilt+=(CAM.ttilt-CAM.tilt)*k;if(Math.abs(CAM.z-CAM.tz)<0.02)CAM.z=CAM.tz;
  CAM.punch=Math.max(0,CAM.punch-dt*1.5);camx=CAM.x-W/2;camy=CAM.y-H/2;}
/* auto-director: picks an angle for each spoken line */
function autoShot(who,line){const mood=moodOf(line,(cut.actors[who]&&cut.actors[who].look)||lookOf(who)),loud=(line.match(/!/g)||[]).length>=2||/[A-Z]{4,}/.test(line.replace(/<[^>]+>/g,''));
  const other=nearestActor(who);cut.lineN=(cut.lineN||0)+1;
  if(mood==='angry'&&loud)return setShot('dutch',who);
  if(loud||mood==='surprised')return setShot('close',who);
  if(!other)return setShot(cut.lineN%2?'medium':'close',who);
  const pick=cut.lineN%3;if(pick===0)return setShot('two',[who,other]);if(pick===1)return setShot('ots',[who,other]);return setShot('close',who);}
/* acting and emotes */
const EMO={'!':1,'?':1,'heart':1,'anger':1,'...':1,'note':1,'sweat':1,'zzz':1};
function actorEmote(id,k){const a=cut&&cut.actors[id];if(a)a.emote={k,t:0};}
function actorAct(id,k){const a=cut&&cut.actors[id];if(a)a.act={k,t:0};}
function autoAct(who,line){const mood=moodOf(line,(cut.actors[who]&&cut.actors[who].look)||lookOf(who));
  if(mood==='angry'){actorAct(who,'shake');actorEmote(who,'anger');}else if(mood==='surprised'){actorAct(who,'hop');actorEmote(who,'!');}

  wb2:{name:'The Riddle Post',keeper:'Widow Puckett',look:KEEP2,kind:'riddle',evidence:'<b>Statement of Widow Puckett.</b> "Kyle stopped at my well the next morning and paid for water with a Wilmington church token. Who carries church tokens but the man who robbed the church fund?"',intro:'"Three riddles. Answer all three and the ribbon is yours. Miss one and we start over."',money:2,xp:20},

const QUIZ=[
  {q:'"Which city hosts the Continental Congress this very autumn?"',a:['Philadelphia','Boston','Wilmington'],ok:0},

function giveXp(n){const b=level();S.xp+=n;const a=level();if(a>b){S.sp+=a-b;for(const id of new Set([...partyIds(),...S.roster]))S.hp[id]=maxHpOf(id);}return a>b?a:0;}
function pole(id){const p=POLES[id];if(!S.poles)S.poles={};
  if(S.poles[id])return say(p.look,p.keeper,p.kind==='ferry'?`"The ferry's lashed bank to bank for you, friend. No charge, ever."`:`"You've already earned this pole's ribbon. There are more poles on every road."`,[{label:'Leave',fn:()=>townMenu()}]);
  say(p.look,p.keeper,`<b>Liberty Pole: ${p.name}</b>\n${p.intro}\n<span class="note">Reward: a Liberty Ribbon, ${money(p.money)} and ${p.xp} XP.</span>`,[
    {label:'Take the challenge',hl:!S.flags.poleTried,fn:()=>{S.flags.poleTried=1;save();({aim:aimTrial,riddle:riddleTrial,fight:fightTrial,ferry:ferryTrial})[p.kind](id);}},
    ...(p.kind==='ferry'&&!S.flags.ferry_wp?[{label:'Pay the fare <span class="note">$1.00, just cross the river</span>',dis:S.money<1,fn:()=>{S.money=r2(S.money-1);sfx('coin');ferryDone('He poles you across, grumbling about his back. Then he lashes the ferry bank to bank. "Saves me rowing. Cross whenever you like."');}}]:[]),
    {label:'"What are Liberty Poles?"',fn:()=>say(p.look,p.keeper,`"The Sons of Liberty raised them along every road. Each one has a keeper and a challenge. Win, and you get a Liberty Ribbon. Pin three ribbons to your hat at any campfire and you'll grow stronger."`,[{label:'Back',fn:()=>pole(id)}])},
    {label:'Leave',fn:()=>townMenu()}]);}
function poleWin(id){const p=POLES[id];S.poles[id]=1;S.ribbons=(S.ribbons||0)+1;S.money=r2(S.money+p.money);const lv=giveXp(p.xp);if(!S.flags.roadGuide)S.flags.roadGuide=1;save();scene('town');
  showCard('LIBERTY RIBBON!',[`${p.name}: complete.`,`+${money(p.money)} and +${p.xp} XP.${lv?' Level up!':''}`,`Ribbons: ${S.ribbons}. Pin 3 at a campfire for an upgrade.`,`${p.keeper} gives you a statement against Kyle.`],()=>townMenu(),'star');}
function aimTrial(id){let i=0,hits=0;const p=POLES[id];
  const next=()=>{if(i>=5){if(hits>=4)return poleWin(id);return say(p.look,p.keeper,`"${hits} of 5. You need 4. Steady your breath and try again."`,[{label:'Try again',fn:()=>aimTrial(id)},{label:'Leave',fn:()=>townMenu()}]);}
    dialog=null;show(`<b>Musket Drill.</b> Target ${i+1} of 5. Hits so far: ${hits}.`,[{label:'Fire!',fn:()=>hitTiming()}],{instant:true,hint:'Press Space when the marker is in the green.'});
    startTiming(0.85+i*0.17,res=>{if(res!=='miss')hits++;sfx(res==='miss'?'miss':'crit');shake=res==='miss'?2:5;resultPop(res==='miss'?'miss':res);i++;setTimeout(next,550);},`Target ${i+1} of 5`,'FIRE!');};
  next();}
const RIDDLES=[
  {q:'"I have a spine but no bones, and many leaves but no branches. What am I?"',a:['A book','A pine tree','A goose'],ok:0},
  {q:'"The more of me you take, the more you leave behind. What am I?"',a:['Silver coins','Footsteps','Tar'],ok:1},
  {q:'"I have a neck but no head, and I wear a cork for a hat. What am I?"',a:['A bottle','A Redcoat','A candle'],ok:0}];
function riddleTrial(id,n=0){const p=POLES[id],SET2=p.set==='QUIZ'?QUIZ:RIDDLES;if(n>=SET2.length)return poleWin(id);const r=SET2[n];
  const order=[0,1,2].sort(()=>rnd()-0.5);
  say(p.look,p.keeper,`<b>${p.qword||'Riddle'} ${n+1} of 3.</b> ${r.q}`,[...order.map(k=>({label:r.a[k],fn:()=>{if(k===r.ok){sfx('win');riddleTrial(id,n+1);}else{sfx('miss');say(p.look,p.keeper,p.set==='QUIZ'?`"Wrong! Back to the start of the lesson."`:`"Wrong! Back to the first riddle."`,[{label:'Try again',fn:()=>riddleTrial(id,0)},{label:'Leave',fn:()=>townMenu()}]);}}})),{label:'Give up for now',fn:()=>townMenu()}]);}
function fightTrial(id){const p=POLES[id];

    intro:p.fightIntro||'"Gentlemen, show our guest the line!"',onWin:()=>{healAll(0.3);poleWin(id);},onLose:()=>{scene('town');say(p.look,p.keeper,'"Not bad. Catch your breath and try me again."',[{label:'Leave',fn:()=>townMenu()}]);}});}

  if(scr==='mini'&&MG)updateMini(dt);

function updateTown(dt){if(S.loc==='gaol'&&S.tut===2&&!STEALTH&&mode==='walk'&&!cut)startGaolStealth();updateChase(dt);updateStealth(dt);
  const T=TOWNS[S.loc];

  honkT=Math.max(0,honkT-dt);honkCD=Math.max(0,honkCD-dt);
  for(const k in barks)barks[k]-=dt;
  for(const w of walkers){w.stop=mode!=='walk'||Math.hypot(w.x-S.px,w.y-S.py)<40;if(w.stop){if(Math.hypot(w.x-S.px,w.y-S.py)<60)w.dir=S.px<w.x?-1:1;continue;}w.x+=w.dir*w.sp*dt;w.dist+=w.sp*dt;if(w.x>w.max)w.dir=-1;if(w.x<w.min)w.dir=1;}
  gooseCool=Math.max(0,gooseCool-dt);
  if(S.loc==='wilmington'&&S.tut!=null&&S.tut>=3&&S.tut<=11&&!S.flags.susCard&&mode==='walk'&&!dialog&&!CARD&&!cut){S.flags.susCard=1;save();
    showCard('TOWN SUSPICION',['Wilmington thinks you stole the silver.','The red pips show how much. 5 is the worst.','While it is high, Clerk Dobbs won\'t deal with you','and people greet you like a thief.','Each tutorial job you finish lowers it.','Pass graduation and it is gone for good.'],null,'eye');}
  if(S.tut===3&&S.loc==='wilmington'&&S.flags.gooseCut&&mode==='walk'&&!dialog&&!CARD&&gooseCool<=0&&geese.some(gz=>Math.hypot(gz.x-S.px,(gz.y-S.py)*1.3)<26)){gooseCool=4;looseTalk();}
  for(const gz of geese){gz.t+=dt;gz.st-=dt;if(gz.st<=0){gz.peck=!gz.peck;gz.st=0.8+rnd()*2;if(!gz.peck&&rnd()<0.4)gz.dir*=-1;}
    if(!gz.peck){gz.x+=gz.dir*12*dt;if(Math.abs(gz.x-gz.hx)>40)gz.dir=Math.sign(gz.hx-gz.x);}
    if(honkCD<=0&&Math.hypot(gz.x-S.px,gz.y-S.py)<28&&mode==='walk'){honkCD=4;honkT=1.2;honkX=gz.x;honkY=gz.y;sfx('honk');gz.dir=Math.sign(gz.x-S.px)||1;gz.peck=false;gz.st=1.5;}}
  for(const a of ANIM){a.t+=dt;a.alert=Math.max(0,a.alert-dt);}
  if(mode!=='walk'){PL.vx=approach(PL.vx,0,900*dt);PL.vy=approach(PL.vy,0,900*dt);updateCam(dt);return;}
  if(ANIM.length&&!cut&&!CARD)updateAnimals(dt);
  let ix=(keys.r?1:0)-(keys.l?1:0),iy=(keys.d?1:0)-(keys.u?1:0);
  if(ix||iy){target=null;pendingAct=null;}
  let arrive=1;
  if(!ix&&!iy&&target){const dx=target.x-S.px,dy=target.y-S.py,d=Math.hypot(dx,dy);
    if(d<2.5){target=null;PL.vx=PL.vy=0;if(pendingAct){const a=pendingAct;pendingAct=null;a();return;}}else{ix=dx/d;iy=dy/d;arrive=clamp(d/24,0.25,1);}}
  const len=Math.hypot(ix,iy);if(len>0){ix/=len;iy/=len;}
  const max=(keys.shift?125:78)*arrive;
  const tvx=ix*max,tvy=iy*max,acc=len>0?620:980;
  PL.vx=approach(PL.vx,tvx,acc*dt);PL.vy=approach(PL.vy,tvy,acc*dt);
  let nx=S.px+PL.vx*dt,ny=S.py+PL.vy*dt;
  if(!walkable(S.loc,nx,S.py)){nx=S.px;PL.vx=0;}if(!walkable(S.loc,nx,ny)){ny=S.py;PL.vy=0;}
  if(target&&Math.hypot(nx-S.px,ny-S.py)<0.02&&len>0){PL.stuck=(PL.stuck||0)+dt;if(PL.stuck>0.3){target=null;pendingAct=null;PL.stuck=0;}}else PL.stuck=0;
  S.px=nx;S.py=ny;
  const sp=Math.hypot(PL.vx,PL.vy);
  if(sp>8){PL.dist+=sp*dt;PL.fr=Math.floor(PL.dist/(keys.shift?9:7))%4;if(Math.abs(PL.vx)>6)PL.face=Math.sign(PL.vx);PL.dir=dirOf(PL.vx,PL.vy,PL.dir||'down');
    const last=crumbs[0]||{x:-99,y:-99};if(Math.hypot(S.px-last.x,S.py-last.y)>1.5){crumbs.unshift({x:S.px,y:S.py});if(crumbs.length>300)crumbs.pop();}
    if(keys.shift&&rnd()<0.35)parts.push({x:S.px-PL.face*6,y:S.py-1,vx:-PL.face*20,vy:-12,life:0.5,max:0.5,type:'dust',c:'#c9b89a',world:true});}
  PL.blinkT-=dt;if(PL.blinkT<0)PL.blinkT=2+rnd()*3;
  for(const [i,[kx,ky]] of (T.coins||[]).entries()){if(!S.coins[S.loc+i]&&Math.hypot(S.px-kx,(S.py-ky)*1.3)<13){S.coins[S.loc+i]=1;S.money=r2(S.money+0.5);sfx('coin');pop(kx,ky-30,'+$0.50',P.gold,2,true);save();}}
  if(S.tut!=null)tutIdle+=dt;
  if(S.tut===0){const ms=TOWNS[S.loc].spots.find(x=>x.id==='martha');if(ms&&Math.hypot(ms.sx-S.px,(ms.sy-S.py)*1.2)<30){tutStep(1);townMenu();}}
  for(const s of spots())if(s.look&&s.bark&&barks[s.id]===undefined&&Math.hypot(s.x-S.px,s.y-S.py)<70){barks[s.id]=2.4;}
  updateCam(dt);
  const n=nearSpot();const id=n?n.id:null;if(id!==nearId&&!(elText.innerHTML.indexOf('class="good"')>=0&&id!==null&&false))townMenu();
}
function updateCam(dt){if(cut)return;CAM.z=1;CAM.tilt=0;CAM.punch=0;const T=TOWNS[S.loc];const want=clamp(S.px-W/2+PL.vx*0.45,0,T.w-W);camx+=(want-camx)*(1-Math.exp(-dt*5));const wy=cut?82:clamp(S.py-150+PL.vy*0.3,70,MH-H);camy+=(wy-camy)*(1-Math.exp(-dt*5));}
